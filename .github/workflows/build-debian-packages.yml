# Debian .deb packaging, split out of build-kernel.yml.
# Called (via `uses:`) by build-kernel.yml; runs inside the same workflow
# run, so the artifacts uploaded here are seen by publish-release.yml.

name: Build Debian packages

on:
  workflow_call:
    inputs:
      krel:
        description: Full kernel release string (uname -r), e.g. 6.12.0-next-20250101-unstable-ogc-g12345678-1
        type: string
        required: true
      kverdot:
        description: Kernel version with hyphens replaced by dots, for KDEB_PKGVERSION
        type: string
        required: true
      sha8:
        description: Short (8 char) source commit the packages are built from
        type: string
        required: true

permissions:
  contents: read

env:
  # Config fragments maintained by the OGC kernel-packages repository.
  # The distro base config comes from the official Debian
  # linux-config/linux-image packages.
  KERNEL_PACKAGES_RAW: https://raw.githubusercontent.com/OpenGamingCollective/kernel-packages/main

jobs:
  build:
    name: Build Debian packages
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container:
      image: docker.io/library/debian:trixie
    env:
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 10G
      KREL: ${{ inputs.krel }}
      KVERDOT: ${{ inputs.kverdot }}
      SHA8: ${{ inputs.sha8 }}
    steps:
      - name: Show disk space
        run: df -h /

      - name: Install build tools
        run: |
          set -euxo pipefail
          apt-get update
          # Satisfies the Build-Depends generated by scripts/package/mkdebian
          # (debhelper-compat, bc, bison, flex, kmod, libdw/libelf/libssl-dev,
          # python3, rsync) plus the clang toolchain used by all OGC builds.
          apt-get install -y --no-install-recommends \
            build-essential debhelper rsync \
            bc bison flex python3 kmod \
            libelf-dev libdw-dev libssl-dev zlib1g-dev \
            dwarves zstd xz-utils \
            clang llvm lld ccache curl ca-certificates git \
            openssl
          # dpkg-buildpackage refuses to run as root
          useradd -m builder
          install -d -o builder -g builder -m 0777 /ccache

      - name: Download staged sources
        uses: actions/download-artifact@v8
        with:
          name: kernel-sources
          path: /tmp/stage

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: /ccache
          key: ccache-debian-${{ github.sha }}
          restore-keys: |
            ccache-debian-

      - name: Assemble Debian kernel config
        working-directory: /tmp/stage
        run: |
          set -euxo pipefail
          # ------------------------------------------------------------------
          # Base config: the official Debian kernel configuration. It ships in
          # the small linux-config-<abi> package; fall back to /boot/config-*
          # of the linux-image-<abi> package if that is unavailable.
          # ------------------------------------------------------------------
          ABI="$(apt-cache depends linux-image-amd64 \
            | awk '/^ *Depends: *linux-image-[0-9]/ {print $2; exit}' \
            | sed 's/^linux-image-//')"
          test -n "${ABI}"
          echo "Debian kernel ABI: ${ABI}"
          # linux-config is versioned by major.minor only (e.g. 6.12) and
          # stores the per-flavour config xz-compressed, e.g.
          # /usr/src/linux-config-6.12/config.amd64_none_amd64.xz
          KMAJMIN="$(printf '%s' "${ABI}" | cut -d. -f1,2)"
          mkdir -p /tmp/pkgcfg
          if apt-get download "linux-config-${KMAJMIN}"; then
            dpkg-deb -x linux-config-"${KMAJMIN}"_*.deb /tmp/pkgcfg
            BASE="$(find /tmp/pkgcfg/usr/src -name 'config.amd64_none_amd64.xz' | head -n1)"
            test -s "${BASE}"
            xz -dc "${BASE}" > config
          else
            apt-get download "linux-image-${ABI}"
            dpkg-deb -x linux-image-"${ABI}"_*.deb /tmp/pkgcfg
            BASE="$(find /tmp/pkgcfg/boot -maxdepth 1 -name 'config-*' | head -n1)"
            test -s "${BASE}"
            cp "${BASE}" config
          fi
          test -s config
          rm -rf /tmp/pkgcfg

          # ------------------------------------------------------------------
          # Layer the OGC config fragments and the repo-local config.fragment
          # (which wins). kernel-packages ships no debian-specific fragments.
          # Order is critical: unsets apply first, then sets, so explicit
          # enables can override explicit disables.
          # ------------------------------------------------------------------
          for f in ogc.config.set ogc.config.unset; do
            curl -fsSL "${KERNEL_PACKAGES_RAW}/config/${f}" -o "${f}"
          done
          bash ./merge-fragments.sh config \
              ogc.config.unset \
              ogc.config.set \
              config.fragment
          echo "Config after fragment merge (head):"
          head -n 3 config

      - name: Ensure pahole >= 1.31 (sched_ext/BTF)
        run: |
          set -euxo pipefail
          VER="$(pahole --version | tr -d 'v')"
          MAJ="${VER%%.*}"; MIN="${VER#*.}"; MIN="${MIN%%.*}"
          echo "Installed pahole: ${VER}"
          if [ "$MAJ" -lt 1 ] || { [ "$MAJ" -eq 1 ] && [ "$MIN" -lt 31 ]; }; then
            echo "pahole < 1.31 breaks sched_ext; building dwarves 1.31 from source"
            apt-get install -y --no-install-recommends cmake pkg-config
            cd /tmp
            curl -fsSLO https://fedorapeople.org/~acme/dwarves/dwarves-1.31.tar.xz
            echo "0a7f255ccacf8cc7f8cd119099eb327179b4b3c67cb015af646af6d0cb03054d  dwarves-1.31.tar.xz" | sha256sum -c
            tar -xf dwarves-1.31.tar.xz
            cmake -B dwarves-1.31/build -S dwarves-1.31 \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            make -C dwarves-1.31/build -j"$(nproc)" install
          fi
          pahole --version

      - name: Build .deb packages with the in-tree packaging
        run: |
          set -euxo pipefail
          mkdir -p /build
          tar -xzf /tmp/stage/linux.tar.gz -C /build
          cd /build/linux

          # Config adjustments + kernel release suffix, identical scheme to
          # the Arch and Fedora packages (uname -r == ${KREL}).
          cp /tmp/stage/config .config
          # Debian's config references distro-only certificate files that do
          # not exist in this tree; use the ephemeral in-tree key instead.
          scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str SYSTEM_REVOCATION_KEYS ""
          # CONFIG_MODULE_SIG_KEY points at the Debian signing cert, which
          # does not exist in this tree. Reset it to the kbuild default
          # ("certs/signing_key.pem"): an ephemeral self-signed key generated
          # during the build and trusted by the kernel itself. The Debian
          # config sets CONFIG_MODULE_SIG_ALL=y, and with an empty key string
          # scripts/Makefile.modinst resolves sig-key to "./", making
          # sign-file read a directory as the private key (SSL DECODER error)
          # on every module.
          scripts/config --set-str MODULE_SIG_KEY "certs/signing_key.pem"
          scripts/config -u DEFAULT_HOSTNAME
          scripts/config --set-str BUILD_SALT "${KREL}"
          echo "-unstable-ogc-g${SHA8}" > localversion.10-pkgname
          echo "-1" > localversion.20-pkgrel
          # The staged tarball carries no VCS data, but mkdebian (via
          # gen-diff-patch) runs "git diff HEAD" and aborts on failure.
          # A throwaway repo with everything committed makes that a no-op.
          git init -q
          git config user.email "ci@opengamingcollective.org"
          git config user.name "OpenGamingCollective CI"
          git add -A
          git commit -qm "linux-unstable-ogc ${KREL}"
          chown -R builder:builder /build

          # scripts/setlocalversion appends a "+" whenever a git repo exists
          # and LOCALVERSION is unset and the HEAD is not at an annotated
          # version tag. The throwaway repo below would therefore corrupt the
          # release string. Setting LOCALVERSION to the empty string (as
          # documented in the script) suppresses that suffix everywhere.
          runuser -u builder -- env HOME=/home/builder CCACHE_DIR=/ccache \
            LOCALVERSION= \
            make CC="ccache clang" LLVM=1 LLVM_IAS=1 WERROR=0 \
            KBUILD_BUILD_HOST=ogc-ci KBUILD_BUILD_USER=kernel-unstable-ogc \
            olddefconfig

          # Fail fast if the release string ever drifts from the other distros
          REL="$(runuser -u builder -- env HOME=/home/builder LOCALVERSION= make -s kernelrelease)"
          if [ "$REL" != "${KREL}" ]; then
            echo "kernelrelease '$REL' does not match expected '${KREL}'" >&2
            exit 1
          fi

          # Generate the debian/ directory with the tree's own packaging.
          # mkdebian is invoked directly as a script: a bare "make debian" is
          # NOT a top-level make target in this tree (only *-pkg patterns are
          # delegated to scripts/Makefile.package), and going through make
          # without the exact same CC flags as the olddefconfig above made
          # kbuild re-sync the config interactively. As a plain sh script it
          # touches nothing kbuild-related.
          # KDEB_PKGVERSION must not contain hyphens except the final revision
          # separator (Debian policy), hence the dotted translation.
          KDEBVER="${KVERDOT}.unstable.ogc.g${SHA8}-1"
          runuser -u builder -- env HOME=/home/builder \
            srctree="$PWD" \
            ARCH=x86_64 SRCARCH=x86 UTS_MACHINE=x86_64 \
            KERNELRELEASE="${KREL}" \
            KCONFIG_CONFIG=.config \
            KDEB_SOURCENAME=linux-unstable-ogc \
            KDEB_PKGVERSION="${KDEBVER}" \
            KDEB_CHANGELOG_DIST=trixie \
            DEBFULLNAME="OpenGamingCollective CI" \
            DEBEMAIL="ci@opengamingcollective.org" \
            sh scripts/package/mkdebian
          echo "debian arch: $(cat debian/arch)"

          # Kbuild only honours command-line variables, so inject the
          # clang/ccache toolchain into the generated debian/rules (this is
          # what "make bindeb-pkg" would otherwise lose). LOCALVERSION= (set,
          # empty) keeps setlocalversion from appending "+" inside the build.
          sed -i 's|^make-opts = |make-opts = CC="ccache clang" LLVM=1 LLVM_IAS=1 WERROR=0 LOCALVERSION= KBUILD_BUILD_HOST=ogc-ci KBUILD_BUILD_USER=kernel-unstable-ogc |' debian/rules
          grep -n '^make-opts' debian/rules

          # Same invocation as "make bindeb-pkg" (scripts/Makefile.package),
          # but with parallel jobs, --no-check-builddeps (the build deps are
          # preinstalled above; the generated Build-Depends-Arch also names a
          # distro-only cross-gcc package that need not exist), and without
          # the multi-GB debug-symbol package (all other distro jobs ship no
          # debug packages either).
          runuser -u builder -- env HOME=/home/builder CCACHE_DIR=/ccache \
            LOCALVERSION= \
            DEB_BUILD_PROFILES="pkg.linux-unstable-ogc.nokerneldbg" \
            dpkg-buildpackage --build=binary --no-pre-clean --unsigned-changes \
            --no-check-builddeps \
            -R'make -f debian/rules' -j"$(nproc)" -a"$(cat debian/arch)"

          ls -lh /build/*.deb

      - name: Collect Debian artifacts
        run: |
          set -euxo pipefail
          DISTDIR=/tmp/dist
          mkdir -p "${DISTDIR}"
          cp -v "/build/linux-image-${KREL}"_*.deb "${DISTDIR}/"
          cp -v "/build/linux-headers-${KREL}"_*.deb "${DISTDIR}/"
          cp -v /build/linux/.config "${DISTDIR}/config-debian-${KREL}"
          # linux-libc-dev is intentionally NOT shipped: installing it would
          # replace the distribution's own linux-libc-dev package.
          ls -lh "${DISTDIR}"

      - name: Boot smoke test in QEMU (release gate)
        run: |
          set -euxo pipefail
          apt-get update -qq
          # qemu boots the kernel (OVMF provides the UEFI leg); cpio builds
          # the test initramfs.
          apt-get install -y --no-install-recommends qemu-system-x86 cpio ovmf
          # ----------------------------------------------------------------
          # Boot the exact kernel image that ships in the linux-image .deb.
          # This step fails the job (and with it the release) if the kernel
          # panics, hangs or never reaches userspace, so an unbootable
          # kernel is never uploaded or published.
          # ----------------------------------------------------------------
          WORK=/tmp/bootsmoke
          rm -rf "$WORK"; mkdir -p "$WORK"
          DEB="$(find /tmp/dist -name "linux-image-${KREL}_*.deb" | head -n1)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" "$WORK"
          IMG="$(find "$WORK" -name 'vmlinuz-*' -type f | head -n1)"
          test -n "$IMG"
          bash /tmp/stage/boot-smoke-test.sh "$IMG"

      - name: Clean build tree (free disk before cache save)
        run: rm -rf /build ; df -h /

      - name: Upload Debian packages
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: /tmp/dist
          retention-days: 3
